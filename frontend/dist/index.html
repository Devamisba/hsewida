    <style>
      #initial-k3-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background-color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        user-select: none;
      }
      .k3-splash-gear {
        animation: k3-splash-spin 7s linear infinite;
        transform-origin: 100px 100px;
      }
      .k3-splash-cross {
        animation: k3-splash-pulse 2.2s ease-in-out infinite;
        transform-origin: 100px 100px;
      }
      @keyframes k3-splash-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes k3-splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.92; }
      }
      .k3-splash-slogan {
        margin-top: 18px;
        color: #1b6b38;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.5px;
        text-align: center;
        text-transform: uppercase;
        line-height: 1.35;
      }
      .k3-splash-sub {
        margin-top: 8px;
        color: #64748b;
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .k3-splash-dots::after {
        content: '.';
        animation: k3-dots-anim 1.5s steps(4, end) infinite;
      }
      @keyframes k3-dots-anim {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }
